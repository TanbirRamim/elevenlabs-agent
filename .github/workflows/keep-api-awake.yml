name: Keep API awake

# Render's free tier sleeps after 15 idle minutes; a judge's first visit would then wait a minute.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 10 https://shadow-api-8hvl.onrender.com/health
