name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Secrets scan
        run: git ls-files -z | xargs -0 node scripts/check-secrets.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Guard eval (demo-critical catches must not regress)
        run: pnpm eval:guard
      - run: pnpm build

  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Web Worker bundle (OpenNext)
        run: pnpm cf:build:web
        env:
          NEXT_PUBLIC_API_URL: https://shadow-api.example.workers.dev
          NEXT_PUBLIC_API_WS_URL: wss://shadow-api.example.workers.dev
      - name: API Worker bundle (containers not built in CI)
        run: pnpm --filter @shadow/edge exec wrangler deploy --dry-run --outdir dist --containers-rollout=none

  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Each PR touches only its author's files (ownership.json)
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-ownership.mjs
