name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Secrets scan
        run: git ls-files -z | xargs -0 node scripts/check-secrets.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Guard eval (demo-critical catches must not regress)
        run: pnpm eval:guard
      - run: pnpm build
